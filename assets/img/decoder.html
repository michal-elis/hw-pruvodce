<!doctype html>
<meta charset="utf-8">

<textarea id="input" style="width:100%;height:300px;"></textarea>
<button onclick="decodeSvg()">Převést na SVG</button>
<textarea id="output" style="width:100%;height:300px;"></textarea>

<script>
function decodeSvg(){
  const text = document.getElementById("input").value;

  const match = text.match(/data:image\/svg\+xml,([^"]+)/);

  if(!match){
    alert("SVG data nenalezena.");
    return;
  }

  const svg = decodeURIComponent(match[1])
    .replace(/'/g, '"');

  document.getElementById("output").value = svg;
}
</script>
