<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Kvíz | Multimediální průvodce základů hardware</title>
  <meta name="description" content="Krátký popis konkrétní stránky." />

  <link rel="stylesheet" href="../assets/css/style.css" />
</head>

<body>

<div id="header"></div>

  <main id="obsah" class="site-main">
    <div class="container">
      <section class="card">
        <h2>Kvíz</h2>
        <p class="muted">
          Vyber odpověď. Kvíz ji ihned vyhodnotí a ukáže stručné vysvětlení.
        </p>

        <div class="quiz-top">
          <div id="quizProgress" class="muted">0 / 0</div>
          <div id="quizScore" class="muted">Skóre: 0</div>
          <button id="quizReset" class="btn" type="button">Reset</button>
        </div>

        <div id="quizRoot" class="quiz-root" aria-live="polite"></div>

        <div id="quizSummary" class="quiz-summary" hidden></div>
      </section>
    </div>
  </main>

<div id="footer"></div>

<script src="../assets/js/include.js"></script>
<script>
async function loadLayout(){
  await includeHTML("header", "../components/header.html");
  await includeHTML("footer", "../components/footer.html");

  markActiveNav();

  const year = document.getElementById("year");
  if(year){
    year.textContent = new Date().getFullYear();
  }
}

loadLayout();
</script>

  <script src="../assets/js/include.js"></script>
  <script src="../assets/js/kviz.js"></script>
</body>
</html>
